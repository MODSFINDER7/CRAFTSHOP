name: Build CraftShop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        run: gradle build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: craftshop-build
          path: build/libs/*.jar
